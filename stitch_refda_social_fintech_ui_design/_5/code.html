<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #f9f9f7;
        }
        .login-card-shadow {
            box-shadow: 0 8px 20px rgba(19, 66, 53, 0.04);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-container-margin">
<!-- Brand Header -->
<header class="w-full max-w-md flex flex-col items-center mb-section-gap">
<div class="mb-stack-gap">
<!-- Simulated Logo with Brand Styling from JSON -->
<div class="flex flex-col items-center gap-unit">
<div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center shadow-lg transform -rotate-3">
<span class="material-symbols-outlined text-on-primary text-4xl" data-weight="fill">card_giftcard</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-primary tracking-tight mt-4">رفدة</h1>
</div>
</div>
<div class="text-center space-y-unit">
<h2 class="font-headline-lg text-headline-lg text-on-surface">مرحباً بك</h2>
<p class="font-body-md text-body-md text-on-surface-variant">سجل الدخول للمتابعة</p>
</div>
</header>
<!-- Main Login Content -->
<main class="w-full max-w-md">
<div class="bg-surface-container-lowest login-card-shadow rounded-lg p-8 flex flex-col gap-stack-gap border border-surface-container-high">
<!-- Hero Decorative Image -->
<div class="w-full h-32 rounded-DEFAULT overflow-hidden mb-unit">
<img class="w-full h-full object-cover opacity-80 mix-blend-multiply" data-alt="A luxurious minimalist composition featuring soft silk textures in warm sand and deep emerald green colors. The lighting is diffused and atmospheric, creating a sense of premium Saudi hospitality and high-end digital finance. Golden accents catch the light subtly in the background, reinforcing the sophisticated and reliable brand identity of a modern fintech app." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB967g9R3vhEbSnOdx_iFeHWrDgPfrZ4DIk10RN-6gBS8ArRSiG_Xn5pRhmhin_tvuoyDmsR6GXMmA1U8Vnn_3mCscvzH6oO9AVLUf3pKf4bN_FDUEFVBx2CblnXu5WqCE-rRCjKYZmjKy5_rVfQlrjLze4Ox_y0NhQnuIXPuUx-brpuZRZgR6y8mmjTZUMc1mlFl9Y0FOPbAy6VQUvsxz0Zxyqa5yINBQwOdNvi1EyEHbT76ngo63LrccwWm_j1DvJcWb_w4g18kw"/>
</div>
<!-- Phone Number Input Group -->
<div class="flex flex-col gap-unit">
<label class="font-label-md text-label-md text-on-surface-variant mr-unit uppercase tracking-widest" for="phone">رقم الجوال</label>
<div class="relative group">
<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none gap-2">
<!-- Saudi Flag Icon Simulation -->
<div class="w-6 h-4 bg-[#006C35] rounded-sm flex items-center justify-center overflow-hidden">
<div class="w-px h-2 bg-white/40 transform rotate-12"></div>
</div>
<span class="text-on-surface font-semibold text-body-md" dir="ltr">+966</span>
<div class="h-6 w-px bg-outline-variant mx-unit"></div>
</div>
<input class="w-full pr-[110px] pl-inline-padding py-4 bg-surface-container-low border-none rounded-DEFAULT text-on-surface font-body-md focus:ring-2 focus:ring-primary-container transition-all placeholder:text-outline-variant text-right" id="phone" placeholder="5X XXX XXXX" type="tel"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full py-4 bg-primary text-on-primary rounded-full font-headline-lg text-headline-lg hover:bg-primary-container transition-all active:scale-95 shadow-md flex items-center justify-center gap-unit">
<span>إرسال الرمز</span>
<span class="material-symbols-outlined text-on-primary transform rotate-180">arrow_forward</span>
</button>
<!-- Secondary Actions -->
<div class="mt-unit flex flex-col items-center gap-stack-gap">
<div class="flex items-center gap-unit">
<a class="font-body-sm text-body-sm text-primary font-bold hover:underline" href="#">ليس لديك حساب؟ سجل الآن</a>
</div>
<div class="w-full flex items-center gap-stack-gap opacity-30">
<div class="h-px bg-outline flex-grow"></div>
<span class="font-label-md text-label-md">أو</span>
<div class="h-px bg-outline flex-grow"></div>
</div>
<!-- Bio-metric Suggestion -->
<button class="flex items-center gap-inline-padding px-6 py-3 rounded-full border border-outline-variant hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant">fingerprint</span>
<span class="font-label-md text-label-md text-on-surface-variant">الدخول بواسطة بصمة الوجه</span>
</button>
</div>
</div>
</main>
<!-- Footer Trust Elements -->
<footer class="mt-section-gap flex flex-col items-center gap-unit text-center">
<p class="font-label-md text-label-md text-outline">خاضع لرقابة ساما</p>
<div class="flex gap-stack-gap opacity-40 grayscale">
<span class="material-symbols-outlined text-on-surface-variant">verified_user</span>
<span class="material-symbols-outlined text-on-surface-variant">lock</span>
<span class="material-symbols-outlined text-on-surface-variant">security</span>
</div>
</footer>
</body></html>
