<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "primary-container": "#2d5a4c",

                        "on-secondary-fixed-variant": "#4f4538",
                        "on-surface": "#1a1c1b",
                        "surface-bright": "#f9f9f7",
                        "on-background": "#1a1c1b",
                        "outline": "#717975",
                        "surface-container": "#eeeeec",
                        "surface-container-highest": "#e2e3e0",
                        "surface-container-high": "#e8e8e6",
                        "on-secondary-container": "#6d6354",
                        "secondary-fixed-dim": "#d2c4b2",
                        "secondary": "#675d4e",
                        "tertiary": "#735c00",
                        "primary-fixed": "#bcedda",
                        "on-tertiary-container": "#4e3d00",
                        "inverse-primary": "#a1d1bf",
                        "tertiary-fixed": "#ffe088",
                        "primary": "#134235",
                        "inverse-surface": "#2f3130",
                        "tertiary-fixed-dim": "#e9c349",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#221a0f",
                        "tertiary-container": "#cca72f",
                        "on-primary-container": "#a0cfbe",
                        "on-primary-fixed-variant": "#214f41",
                        "surface": "#f9f9f7",

                        "surface-variant": "#e2e3e0",

                        "inverse-on-surface": "#f1f1ef",
                        "surface-tint": "#3a6758",
                        "background": "#f9f9f7",
                        "secondary-container": "#efe0cd",
                        "on-surface-variant": "#404945",
                        "secondary-fixed": "#efe0cd",
                        "surface-container-low": "#f4f4f1",
                        "primary-fixed-dim": "#a1d1bf",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#002118",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#574500",
                        "surface-dim": "#dadad8",
                        "on-tertiary-fixed": "#241a00"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "24px",
                        "unit": "4px",
                        "stack-gap": "16px",
                        "section-gap": "32px",
                        "inline-padding": "12px"
                    },
                    "fontFamily": {
                        "headline-xl": ["Manrope"],
                        "label-md": ["Manrope"],
                        "body-sm": ["Manrope"],
                        "body-md": ["Manrope"],
                        "headline-lg": ["Manrope"]
                    },
                    "fontSize": {
                        "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #f9f9f7;
            font-family: 'Manrope', sans-serif;
        }
        .warm-accent {
            background: linear-gradient(135deg, #efe0cd 0%, #f9f9f7 100%);
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-on-background">
<!-- Top Navigation Bar -->
<header class="flex justify-between items-center w-full px-container-margin py-inline-padding bg-background sticky top-0 z-10">
<div class="flex items-center gap-2">
<span class="font-headline-xl text-headline-xl text-primary tracking-tight">Refda</span>
</div>
<button class="p-2 hover:bg-surface-container-low transition-colors rounded-full">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
</header>
<main class="flex-grow flex flex-col items-center px-container-margin pt-12 pb-section-gap max-w-lg mx-auto w-full">
<!-- Hero Visual Section -->
<div class="w-full mb-section-gap relative overflow-hidden rounded-lg aspect-video warm-accent flex items-center justify-center border border-secondary-container/30">
<div class="absolute inset-0 bg-[url('image-header-pattern')] opacity-10 mix-blend-overlay"></div>
<div class="z-0 w-full h-full">
<img class="w-full h-full object-cover" data-alt="A serene and luxurious Saudi-inspired living space" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBVrltSuYj7dOuzZoIvopadZmE_pjiIyZmGnylBvUuECZWZM8RdB9SbH5m5nOjCBZZ7xgJ4Gf2HMad8bCJFHSLsEn45naXE04G0q8qjA7Qrderhs7CTW1jtmvJsZ-Gbb2-3GnOY8LhUenqyO5ijpTnBL6i9zIXdUvXwa7vXFH1jcF62OTwdSjehWBc8cb-ORBpo1DFYTBbtefFHftIaNuA66621NEZI01BsuntwMQq2tR5dkBjL8CIkhn-El-2pX_HTQWCjZHj5sc0"/>
</div>
</div>
<!-- Registration Content -->
<div class="w-full space-y-stack-gap text-right">
<div class="mb-8">
<h1 class="font-headline-xl text-headline-xl text-primary mb-2">انضم لرفدة</h1>
<p class="font-body-md text-body-md text-on-surface-variant">ابدأ تجربة إهداء استثنائية اليوم</p>
</div>
<form class="space-y-6">
<!-- Name Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1">الاسم الكامل</label>
<div class="relative group">
<input class="w-full bg-white border border-outline-variant rounded-lg px-6 py-4 text-right focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-outline/50" placeholder="أدخل اسمك الكامل" type="text"/>
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">person</span>
</div>
</div>
<!-- Phone Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1">رقم الجوال</label>
<div class="relative flex flex-row-reverse group">
<div class="flex-grow">
<input class="w-full bg-white border border-outline-variant rounded-r-lg px-6 py-4 text-left focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-outline/50" dir="ltr" placeholder="5XXXXXXXX" type="tel"/>
</div>
<div class="bg-secondary-container/30 border-y border-l border-outline-variant rounded-l-lg px-4 flex items-center justify-center font-body-md text-primary font-bold">
                            +966
                        </div>
</div>
</div>
<!-- Terms & Conditions -->
<div class="flex items-start gap-3 pt-2">
<div class="mt-1">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary" id="terms" type="checkbox"/>
</div>
<label class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed" for="terms">
                        أوافق على <a class="text-primary font-bold underline underline-offset-4" href="#">الشروط والأحكام</a>
</label>
</div>
<!-- Action Button -->
<div class="pt-8">
<button class="w-full bg-primary text-on-primary font-headline-lg text-headline-lg py-5 rounded-lg shadow-lg hover:bg-primary-container active:scale-95 transition-all duration-200 flex items-center justify-center gap-3" type="submit">
<span>إنشاء حساب</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_back_ios</span>
</button>
<p class="font-body-sm text-body-sm text-center text-on-surface-variant mt-6">
                        لديك حساب بالفعل؟ <a class="text-primary font-bold" href="#">سجل الدخول</a>
</p>
</div>
</form>
</div>
<!-- Cultural Motif -->
<div class="mt-section-gap opacity-30">
<svg fill="none" height="40" viewbox="0 0 120 40" width="120" xmlns="http://www.w3.org/2000/svg">
<path d="M0 20C20 20 20 0 40 0C60 0 60 20 80 20C100 20 100 40 120 40" stroke="#134235" stroke-dasharray="4 4" stroke-width="2"></path>
</svg>
</div>
</main>
<!-- Bottom Spacing -->
<footer class="h-24 pointer-events-none"></footer>
</body></html>
