services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - GIN_MODE=release
      - DATABASE_HOST=postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: refda
      POSTGRES_PASSWORD: refda
      POSTGRES_DB: refda
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refda -d refda"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
